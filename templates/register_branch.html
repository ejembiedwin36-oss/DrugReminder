<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Register Hospital Branch</title>
</head>

<body>

    <h1>Register Hospital Branch</h1>

    <form method="POST">

        <label for="branch_name">Branch Name:</label>
        <input type="text" id="branch_name" name="branch_name" required>

        <label for="is_headquarters">Is this the headquarters?</label>
        <input type="checkbox" id="is_headquarters" name="is_headquarters" value="true">

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" required>

        <label for="location">Location:</label>
        <input type="text" id="location" name="location">

        <label for="information">Information:</label>
        <textarea id="information" name="information"></textarea>

        <button type="submit">Register Branch</button>

    </form>

</body>
</html>
