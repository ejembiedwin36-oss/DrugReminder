<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>DrugReminder Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .message { padding: 12px; margin: 15px 0; border: 1px solid #b00020; max-width: 600px; }
        label { display: block; margin-top: 12px; }
        input { padding: 8px; width: 320px; max-width: 100%; }
        button { margin-top: 16px; padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>DrugReminder Login</h1>

    {% if message %}
        <div class="message"><strong>Login problem:</strong> {{ message }}</div>
    {% endif %}

    <form method="POST">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ request.form.get('email', '') }}" required autocomplete="email">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <button type="submit">Log in</button>
    </form>

    <p><a href="{{ url_for('signup') }}">Create an account</a></p>
</body>
</html>
